<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="user-scalable=no">
	<title>Insanity Cannabis</title>
	<link rel="icon" href="./img/icon-64.png">
	<script src="./three.js"></script>
	<script src="./app.js" type="module" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="main.css">
</head>

<body>
	<div id="render"></div>
	<div id="game"></div>

	<!-- https://developers.google.com/youtube/iframe_api_reference -->
	<div id="bgm_player"></div>
	<script>
		var player;
		var playerReady = false;
		function onYouTubeIframeAPIReady() {
			player = new YT.Player('bgm_player', {
				events: {
					onReady: onPlayerReady,
				},
				height: '1',
				width: '1',
				playerVars: { 'loop': 1, 'autoplay': 1, 'controls': 0, 'playlist': 'arq7-XXEM5o' },
				videoId: 'arq7-XXEM5o'
			});
		}
		// App 不等 YouTube 播放器，播放器就緒後再接上；兩者完成順序不一定
		function onPlayerReady(event) {
			playerReady = true;
			if (window.app) {
				window.app.setBgmPlayer(player);
			}
		}
		function startApp() {
			window.app = new App();
			if (playerReady) {
				window.app.setBgmPlayer(player);
			}
		}
		window.onfocus = function() {
			if (window.app && window.app.bgm_player) {
				window.app.bgm_player.playVideo();
			}
		}
		// 瀏覽器會擋下未經使用者互動的有聲自動播放，所以在第一次互動時再播放
		var GESTURE_EVENTS = ['pointerdown', 'keydown', 'touchstart'];
		function playBgmOnGesture() {
			if (!window.app || !window.app.bgm_player) {
				return;
			}
			window.app.bgm_player.playVideo();
			GESTURE_EVENTS.forEach(type =>
				window.removeEventListener(type, playBgmOnGesture, true));
		}
		GESTURE_EVENTS.forEach(type =>
			window.addEventListener(type, playBgmOnGesture, true));
	</script>
	<!-- async 載入，YouTube 慢或被擋時不會卡住頁面 -->
	<script src="https://www.youtube.com/iframe_api" async></script>
	<!-- module 依文件順序執行，這裡會在 app.js 之後執行 -->
	<script type="module">
		startApp();
	</script>

	<div id="loading">
		<div id="loadingContent">
			<img id="gif2" src="img/square.gif"><br>
			<div id="gifBlock"></div><br>
			Loading...<span id="loadingCnt">(0/0)</span>
		</div>
	</div>
</body>

</html>
